# gitleaks: the default rules. Test keys come only from fixed, public test
# seeds; an allowlist for vettid-vault's public test vectors is added with
# the first PR that copies any (VAULT-MESSAGING §16).
[extend]
useDefault = true

# The ballot protocol's test vectors (BALLOT-PROTOCOL §11): every value
# is derived from a fixed, public phrase (vote/vectors_test.go),
# so a field such as record_secret is not a secret. Only this file, at
# its path and the path it had before (internal/ballot), which history keeps.
[[allowlists]]
description = "ballot protocol test vectors from fixed public inputs"
paths = ['''^vote/testdata/vectors\.json$''', '''^internal/ballot/testdata/vectors\.json$''']

# The anchor-bundle vector (BALLOT-PROTOCOL §11): a proposal published on
# votes.staging.vettid.org with its public anchor key, signatures and
# Sigstore bundle, and Sigstore's public trusted root. Nothing in it is
# secret.
[[allowlists]]
description = "anchor-bundle vector of public, published values"
paths = ['''^vote/testdata/anchor-vector\.json$''']
